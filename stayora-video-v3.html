<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StayOra – Direct Booking</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #0d1f1a;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #fff;
  }

  /* Animated background gradient */
  .bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0d1f1a 0%, #1a3a30 40%, #0d1f1a 80%, #111 100%);
  }

  /* Gold shimmer overlay */
  .shimmer {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(201,162,39,0.12) 0%, transparent 60%);
    animation: shimmerPulse 5s ease-in-out infinite;
  }

  @keyframes shimmerPulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  /* Decorative lines */
  .deco-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, #C9A227, transparent);
    height: 1px;
    width: 60%;
    left: 20%;
    opacity: 0;
  }
  .deco-line.top { top: 220px; animation: fadeSlideIn 0.8s 0.5s forwards; }
  .deco-line.bottom { bottom: 220px; animation: fadeSlideIn 0.8s 0.5s forwards; }

  @keyframes fadeSlideIn {
    from { opacity: 0; width: 0; left: 50%; }
    to { opacity: 0.6; width: 60%; left: 20%; }
  }

  /* Logo area */
  .logo-wrap {
    position: absolute;
    top: 260px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
    animation: logoReveal 1s 0.3s cubic-bezier(0.16,1,0.3,1) forwards;
    width: 600px;
  }

  @keyframes logoReveal {
    from { opacity: 0; transform: translateX(-50%) translateY(30px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .logo-wrap img {
    width: 480px;
    filter: drop-shadow(0 4px 24px rgba(201,162,39,0.3));
  }

  /* Divider */
  .divider {
    position: absolute;
    top: 700px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    opacity: 0;
    animation: fadeSlideIn2 0.8s 1.0s forwards;
  }

  @keyframes fadeSlideIn2 {
    from { opacity: 0; transform: translateX(-50%) scaleX(0); }
    to { opacity: 1; transform: translateX(-50%) scaleX(1); }
  }

  .divider-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #C9A227);
  }
  .divider-line.right {
    background: linear-gradient(90deg, #C9A227, transparent);
  }
  .divider-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #C9A227;
    box-shadow: 0 0 10px rgba(201,162,39,0.8);
  }

  /* Main headline */
  .headline {
    position: absolute;
    top: 760px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 900px;
    opacity: 0;
    animation: textReveal 0.9s 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  @keyframes textReveal {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .headline .skip {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 38px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #C9A227;
    margin-bottom: 24px;
  }

  .headline .main-text {
    font-family: 'Playfair Display', serif;
    font-size: 80px;
    font-weight: 600;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 20px;
  }

  .headline .main-text span {
    color: #C9A227;
    font-style: italic;
  }

  .headline .sub {
    font-size: 34px;
    font-weight: 300;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
    margin-top: 10px;
  }

  /* Emoji badge */
  .emoji-row {
    position: absolute;
    top: 1060px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 52px;
    letter-spacing: 20px;
    opacity: 0;
    animation: emojiPop 0.7s 1.8s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  @keyframes emojiPop {
    from { opacity: 0; transform: translateX(-50%) scale(0.5); }
    to { opacity: 1; transform: translateX(-50%) scale(1); }
  }

  /* Contact card */
  .contact-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translateX(-50%) translateY(-50%);
    width: 860px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,162,39,0.3);
    border-radius: 24px;
    padding: 60px 70px;
    backdrop-filter: blur(10px);
    opacity: 0;
    animation: cardSlideUp 1s 2.2s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  @keyframes cardSlideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(calc(-50% + 40px)); }
    to { opacity: 1; transform: translateX(-50%) translateY(-50%); }
  }

  .contact-row {
    display: flex;
    align-items: center;
    margin-bottom: 32px;
    gap: 24px;
  }
  .contact-row:last-child { margin-bottom: 0; }

  .contact-icon {
    font-size: 40px;
    width: 60px;
    text-align: center;
    flex-shrink: 0;
  }

  .contact-text {
    font-size: 38px;
    font-weight: 400;
    color: #fff;
  }

  .contact-text .label {
    font-size: 26px;
    font-weight: 300;
    color: rgba(255,255,255,0.5);
    display: block;
    margin-bottom: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .contact-text strong {
    color: #C9A227;
    font-weight: 600;
  }


</style>
</head>
